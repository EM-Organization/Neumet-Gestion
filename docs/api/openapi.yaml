openapi: 3.1.0
info:
  title: NEUMET API de proveedor (app de medición)
  version: 0.2.0-draft
  x-cambios:
    - "0.2.0-draft: guardar_montaje_mm acepta odometro_km (RN-12). Opcional salvo que el cliente lo exija; ausente con exigencia responde 422. Sin el campo, el contrato de 0.1.0 sigue valiendo."
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Contrato derivado de `API_PROVEEDOR.pdf`. BORRADOR: ver docs/07-api-proveedor.md
    para las ambigüedades abiertas (§5) y el diseño de seguridad (§4).
    El éxito requiere HTTP 2xx y `code = 200` en el cuerpo (login: HTTP exactamente 200).

    ## Motivos de rechazo por posición (internos, en `ingesta_log`; no viajan en la respuesta)

    | Motivo | Significado / acción esperada |
    |---|---|
    | `vehiculo` | Matrícula inexistente para el cliente y ninguna posición permite crearla (en cuanto hay una posición válida, 1..16 o 99 con las tres lecturas, el vehículo se crea). Enviar una posición válida. |
    | `sin_neumaticos` | El coche existe pero no tiene neumáticos montados con `idneumatico`. Cargar las ruedas del coche en el panel. Estado global ok. |
    | `posicion` | El coche tiene neumáticos pero la posición no existe en su montaje. Revisar con `obtener_montaje`. |
    | `sin_medicion` | Rueda no auxilio con los cuatro mm null. Medir y reenviar. |
    | `incompleta` | Algunos mm null y otros con valor. Enviar los cuatro. |
    | `rango` | mm fuera de 0..40. Repetir la medición. |
    | `duplicado_distinto` | mm3 distinto de mm2. Corregir la app. |
    | `distribucion` | La distribución informada no es la del coche (o no cuadra con su tipo de ruedas). No se guarda ninguna posición de la request. Usar la que devuelve `obtener_montaje`. Estado global ok. |
    | `error` | Fallo inesperado en esa posición. Reintentar; si persiste, avisar con `X-Request-Id`. |
    | `odometro` | (Nivel de request, no de posición.) `odometro_km` inválido (400) o ausente con el cliente obligado a informarlo (422). No se guarda nada. Enviar el odómetro del vehículo. |

    ## Odómetro del vehículo (RN-12, opcional salvo que el cliente lo exija)

    Campo `odometro_km` a nivel de request (no dentro de `montajes`). Entero de 0 a 2147483647. Ausente o `null`: no informado.
    Un valor menor que el odómetro anterior del vehículo se guarda igual; la base lo marca como sospechoso y no baja el odómetro del vehículo. Detalle en docs/07, apéndice C.

    `obtener_montaje` de un coche existente sin neumáticos responde `code 200` y `data: []`.

    ## Distribución de neumáticos (opcional)

    Catálogo: `4x2` (6 ruedas: eje simple, doble), `6x2` (8: simple, doble, simple), `6x4` (10: simple, doble, doble),
    `8x2` (10: simple, simple, doble, simple), `8x4` (12: simple, simple, doble, doble). Ejes de adelante hacia atrás;
    el auxilio es la posición 99 y no cuenta. Numeración: eje simple = izquierda, derecha; eje doble = izquierda exterior,
    izquierda interior, derecha interior, derecha exterior. Ver docs/07, apéndice B.
servers:
  - url: https://kootszosdejmawanfxug.supabase.co/functions/v1/api-proveedor
    description: Producción. La función acepta las rutas con y sin este prefijo
paths:
  /auth/login:
    post:
      summary: Autenticación (cuenta dedicada por cliente)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { description: Cuerpo inválido }
        '401': { description: Credenciales inválidas }
        '5XX': { description: Error de servidor }
  /emenube/neumaticos/obtener_montaje:
    post:
      summary: Neumáticos montados de un vehículo y su última medición
      operationId: obtenerMontaje
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObtenerMontajeRequest' }
      responses:
        '200':
          description: Procesado (vehículo inexistente o ajeno => code 404 y data vacío; vehículo sin neumáticos cargados => code 200 y data vacío)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObtenerMontajeResponse' }
        '400': { description: 'JSON inválido o fuera de límites (tamaño, nº de montajes)' }
        '401': { description: Token vencido o inválido }
        '5XX': { description: Error de servidor }
  /emenube/neumaticos/guardar_montaje_mm:
    post:
      summary: Registro de mediciones por posición
      operationId: guardarMontajeMm
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarMontajeRequest' }
      responses:
        '200':
          description: |
            Procesado. Fallos por neumático se informan con guardado=false (HTTP 2xx).
            La respuesta NO incluye el motivo; se registra en `ingesta_log` (ver tabla de motivos
            en `info.description` y docs/07 Apéndice B). Un coche existente sin neumáticos cargados
            devuelve guardado=false en todas sus posiciones (motivo interno `sin_neumaticos`).
            Una matrícula inexistente del cliente con al menos una posición válida CREA el vehículo y sus
            neumáticos y guarda las mediciones (docs/07 Apéndice B, «Alta de vehículo»); la respuesta conserva su forma.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardarMontajeResponse' }
        '400': { description: 'JSON inválido, fuera de límites (tamaño, nº de montajes) o odometro_km inválido (decimal, negativo, texto o fuera de integer). Cuerpo {code: 400, message: "Solicitud inválida"}' }
        '401': { description: Token vencido o inválido }
        '422': { description: 'El cliente exige el odómetro y la request no lo trae. Cuerpo {code: 422, message: "Solicitud inválida"}. No se guarda nada; motivo interno odometro.' }
        '5XX': { description: Error de servidor }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    LoginRequest:
      type: object
      required: [email, clave, tipoLogin]
      properties:
        email: { type: string, format: email }
        clave: { type: string, format: password }
        tipoLogin: { type: integer, enum: [2] }
    LoginResponse:
      type: object
      required: [code, access_token]
      properties:
        code: { type: integer, enum: [200] }
        access_token: { type: string }
    ObtenerMontajeRequest:
      type: object
      required: [matricula, numero]
      description: Exactamente uno de los dos campos con valor; el otro cadena vacía. Mayúsculas.
      properties:
        matricula: { type: string }
        numero: { type: string }
    Neumatico:
      type: object
      required: [idneumatico, codigo, posicion, auxilio]
      properties:
        idneumatico: { type: string, minLength: 1 }
        codigo: { type: string }
        posicion: { type: integer }
        auxilio: { type: string, enum: ['si', 'no'] }
        mm1: { type: [number, string, 'null'], description: Borde interno }
        mm2: { type: [number, string, 'null'], description: Centro }
        mm3: { type: [number, string, 'null'], description: Centro (igual a mm2) }
        mm4: { type: [number, string, 'null'], description: Borde externo }
    ObtenerMontajeResponse:
      type: object
      required: [code]
      properties:
        code: { type: integer, description: 200 si el vehículo existe }
        matricula: { type: string, description: 'Siempre devuelta, aunque se busque por numero' }
        numero: { type: string }
        distribucion:
          type: string
          enum: ['', '4x2', '6x2', '6x4', '8x2', '8x4']
          description: Distribución de neumáticos del vehículo; cadena vacía si no está definida. Ausente si el vehículo no se encontró.
        data:
          type: array
          items: { $ref: '#/components/schemas/Neumatico' }
    Montaje:
      type: object
      required: [posicion]
      properties:
        posicion: { type: integer }
        mm1: { type: [number, 'null'], minimum: 0, maximum: 40 }
        mm2: { type: [number, 'null'], minimum: 0, maximum: 40 }
        mm3: { type: [number, 'null'], minimum: 0, maximum: 40, description: Siempre igual a mm2 }
        mm4: { type: [number, 'null'], minimum: 0, maximum: 40 }
    GuardarMontajeRequest:
      type: object
      required: [patente, numero, montajes]
      properties:
        patente: { type: string, description: La devuelta por obtener_montaje }
        numero: { type: string, enum: [''], description: Siempre cadena vacía }
        distribucion:
          type: string
          enum: ['', '4x2', '6x2', '6x4', '8x2', '8x4']
          description: Opcional. Distribución de neumáticos del vehículo; ausente, null o vacío = no informada. Otro valor responde 400. Con un vehículo existente de otra distribución no se guarda nada (motivo interno `distribucion`).
        odometro_km:
          type: [integer, 'null']
          minimum: 0
          maximum: 2147483647
          description: >-
            Opcional. Odómetro del vehículo al momento de la inspección, en km enteros. Ausente o null = no informado.
            Si el cliente exige el odómetro y falta, responde 422. Decimal, negativo, texto o fuera de rango, 400.
            Con la misma Idempotency-Key y otro odómetro responde 409.
        montajes:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/Montaje' }
    GuardarMontajeResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, enum: [200] }
        data:
          type: object
          properties:
            guardados:
              type: array
              items:
                type: object
                required: [posicion, guardado]
                properties:
                  posicion: { type: integer }
                  guardado: { type: boolean }
