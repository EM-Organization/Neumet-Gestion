# Configuracion minima de Supabase CLI para NEUMET.
project_id = "kootszosdejmawanfxug"

[auth]
enabled = true
site_url = "https://CAMBIAR-DOMINIO"
additional_redirect_urls = ["https://CAMBIAR-DOMINIO", "http://localhost:3000"]
enable_signup = false
minimum_password_length = 12

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.contacto]
verify_jwt = false

[functions.api-proveedor]
verify_jwt = false

# Valida el JWT y el rol admin dentro del handler; el preflight CORS (OPTIONS) no lleva token.
[functions.crear-cliente]
verify_jwt = false

# Valida el JWT y el rol admin dentro del handler; el preflight CORS (OPTIONS) no lleva token.
[functions.crear-cuenta-api]
verify_jwt = false
