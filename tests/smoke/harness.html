<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>SMOKE:RUNNING</title></head>
<body>
<script src="/tests/smoke/clientes.flow.js"></script>
<script src="/tests/smoke/salud.flow.js"></script>
<script src="/tests/smoke/flota.flow.js"></script>
<script src="/tests/smoke/vehiculo.flow.js"></script>
<script src="/tests/smoke/ciclo.flow.js"></script>
<script src="/tests/smoke/cambio.flow.js"></script>
<script src="/tests/smoke/seccionales.flow.js"></script>
<script src="/tests/smoke/inicio.flow.js"></script>
<script src="/tests/visual/scenes.js"></script>
<script>
// Carga adminpanel/index.html en un iframe (srcdoc), sustituye el CDN de supabase por tests/smoke/stub.js
// y recorre vistas y modales. Resultado en document.title: SMOKE:OK | SMOKE:FAIL:<mensaje>
(async function(){
  var errors=[], log=[];
  var sleep=function(ms){ return new Promise(function(r){ setTimeout(r,ms); }); };
  function fail(m){ errors.push(String(m)); }
  var sig=function(t){ var h=0; for(var k=0;k<t.length;k++) h=(h*31+t.charCodeAt(k))|0; return t.length+':'+(h>>>0).toString(16); };
  var cliMode=/[?&]cliente=1/.test(location.search);
  try{
    var src=await (await fetch('/adminpanel/index.html')).text();
    src=src.replace(/<script[^>]*supabase[^>]*><\/script>/,'<script src="/tests/smoke/stub.js"><\/script><script src="/tests/smoke/clientes.fixture.js"><\/script><script src="/tests/smoke/salud.fixture.js"><\/script><script src="/tests/smoke/ciclo.fixture.js"><\/script><script src="/tests/smoke/flota.fixture.js"><\/script><script src="/tests/smoke/seccionales.fixture.js"><\/script><script src="/tests/smoke/vehiculo.fixture.js"><\/script>')
           .replace('<head>','<head><base href="/adminpanel/">');
    var fr=document.createElement('iframe');
    var vw=(location.search.match(/[?&]vw=(\d+)/)||[])[1]||1400, vh=(location.search.match(/[?&]vh=(\d+)/)||[])[1]||900;
    if(/[?&]shot=/.test(location.search)) document.body.style.margin='0';
    fr.style.cssText='width:'+vw+'px;height:'+vh+'px;border:0;display:block';
    document.body.appendChild(fr);
    // Errores durante la carga de los módulos: hook inyectado antes de los scripts. Congela Date (hora fija) para que las firmas de texto sean deterministas.
    src=src.replace('<head>','<head><script>(function(){var R=Date,F=R.UTC(2026,5,15,12,0,0);function FD(){if(!(this instanceof FD))return new R(F).toString();return arguments.length?new (Function.prototype.bind.apply(R,[null].concat([].slice.call(arguments))))():new R(F);}FD.prototype=R.prototype;FD.now=function(){return F};FD.UTC=R.UTC;FD.parse=R.parse;window.Date=FD;})();window.addEventListener("error",function(e){parent.__fail("onerror: "+e.message)});window.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName&&t!==window)parent.__fail("recurso no cargado: "+(t.src||t.href))},true);window.addEventListener("unhandledrejection",function(e){parent.__fail("unhandledrejection: "+(e.reason&&e.reason.message||e.reason))});var __ce=console.error;console.error=function(){parent.__fail("console.error: "+Array.prototype.join.call(arguments," "));__ce.apply(console,arguments)};<\/script>');
    // Con ?end=<vista> o ?shot=<escena> (capturas) se desactivan transiciones/animaciones para que el PNG sea reproducible.
    // Sin esto, Chrome con tiempo virtual puede fotografiar el menú a mitad de la transición (con el ítem anterior aún resaltado).
    if(/[?&](end|shot)=/.test(location.search)) src=src.replace('</head>','<style>*{transition:none!important;animation:none!important}</style></head>');
    window.__fail=fail;
    fr.srcdoc=src;
    await new Promise(function(r){ fr.onload=r; });
    var w=fr.contentWindow, d=w.document;
    var $=function(s){ return d.querySelector(s); };
    var act=function(name){ return $('[data-action="'+name+'"],[onclick^="'+name+'("]'); };
    var click=function(el,what){ if(!el){ fail('no existe elemento: '+what); return false; } el.click(); return true; };
    var nav=function(v){ return click($('.nav-item[data-view="'+v+'"]'),'nav '+v); };
    await sleep(600);
    if($('#app').classList.contains('hidden') && !/[?&]nosession=1/.test(location.search)) fail('la app no salio del login');

    var shotName=(location.search.match(/[?&]shot=([a-z0-9-]+)/)||[])[1];
    if(shotName){
      // Modo capturas (tests/visual/run.sh): deja la vista pedida en pantalla; el PNG lo saca Chrome (tests/visual/scenes.js)
      await window.visualScene(shotName,w,d,sleep,fail,log,cliMode);
      throw new Error('__done');
    }
    if(/[?&]reportes=1/.test(location.search)){
      // Sección Reportes: >1.000 filas -> paginación con range(), CSV (BOM, inyección) e imprimible escapado.
      var waitFor=async function(cond,what){ for(var t=0;t<400;t++){ if(cond()) return true; await sleep(50); } fail('timeout esperando: '+what); return false; };
      nav('reportes');
      await waitFor(function(){ return $('#rep-vehiculo option[value="10"]'); },'opciones de vehiculo');
      if(!$('#view-reportes').classList.contains('active')) fail('vista reportes no activa');
      var captured=[], blobs=[];
      w.open=function(){ return { document:{ write:function(h){ captured.push(h); }, close:function(){} }, focus:function(){}, print:function(){} }; };
      var origCreate=w.URL.createObjectURL; w.URL.createObjectURL=function(b){ blobs.push(b); return origCreate.call(w.URL,b); };
      w.HTMLAnchorElement.prototype.click=function(){ log.push('descarga='+this.download); };
      $('#rep-vehiculo').value='10';
      w.__rangeCalls.length=0;
      click(act('repExportCsv'),'repExportCsv');
      await waitFor(function(){ return blobs.length>0 && !$('#rep-csv-btn').disabled; },'CSV generado');
      var rc=w.__rangeCalls.filter(function(c){ return c[2]==='mediciones'; });
      log.push('range='+JSON.stringify(rc.map(function(c){ return c[0]+'-'+c[1]; })));
      if(rc.length<3||rc[0][0]!==0||rc[0][1]!==999||rc[1][0]!==1000) fail('paginacion range incorrecta: '+JSON.stringify(rc));
      log.push('progreso='+$('#rep-progress').textContent);
      if(!/^2330 filas/.test($('#rep-progress').textContent)) fail('progreso inesperado: '+$('#rep-progress').textContent);
      if(blobs.length!==1) fail('no se creo el Blob CSV'); else {
        var txt=await blobs[0].text();
        var bytes=new Uint8Array(await blobs[0].arrayBuffer()); // Blob.text() descarta el BOM: se verifica en bytes
        if(bytes[0]!==0xEF||bytes[1]!==0xBB||bytes[2]!==0xBF) fail('CSV sin BOM');
        if(txt.indexOf(",'=Camión 01,")===-1) fail('CSV sin proteccion de formulas');
        if(txt.indexOf('"\'=ID,0"')===-1) fail('CSV sin escape de comas en idneumatico');
        log.push('csv-lineas='+txt.split('\r\n').length);
      }
      click(act('repPrint'),'repPrint');
      await waitFor(function(){ return captured.length>0 && !$('#rep-print-btn').disabled; },'imprimible generado');
      if(captured.length!==1) fail('no se abrio reporte imprimible'); else {
        if(captured[0].indexOf('=ID,')!==-1&&captured[0].indexOf('<')===-1) fail('imprimible raro');
        if(captured[0].indexOf('Camión 01')===-1||captured[0].indexOf('Estado por neumático')===-1) fail('imprimible incompleto');
        log.push('imprimible-len='+captured[0].length);
      }
      log.push('handlers-inline='+d.querySelectorAll('[onclick],[onchange],[oninput],[onsubmit]').length);
      throw new Error('__done');
    }
    if(/[?&]detalle=1/.test(location.search)){
      // Vehículos como cliente: buscador + detalle con diagrama (vehiculo.fixture.js): tests/smoke/vehiculo.flow.js
      await window.detalleFlow(w,d,sleep,fail,log);
      log.push('handlers-inline='+d.querySelectorAll('[onclick],[onchange],[oninput],[onsubmit]').length);
      throw new Error('__done');
    }
    if(/[?&]flota=1/.test(location.search)){
      // Flota con prioridades + Centro de alertas (vistas SQL simuladas por flota.fixture.js): tests/smoke/flota.flow.js
      await window.flotaFlow(w,d,sleep,fail,log);
      log.push('handlers-inline='+d.querySelectorAll('[onclick],[onchange],[oninput],[onsubmit]').length);
      throw new Error('__done');
    }
    await window.inicioFlow(w,d,sleep,fail,log,cliMode);
    var views=cliMode?['vehiculos','mediciones']:['clientes','balance','vehiculos','dispositivos','mediciones'];
    for(var i=0;i<views.length;i++){
      nav(views[i]); await sleep(500);
      // El gráfico de balance se dibuja en requestAnimationFrame: esperar a que exista para que la firma sea estable.
      if(views[i]==='balance'){ for(var t=0;t<20&&!d.querySelector('#balance-chart-svg *');t++) await sleep(100); }
      if(!$('#view-'+views[i]).classList.contains('active')) fail('vista no activa: '+views[i]);
      log.push(views[i]+': filas='+d.querySelectorAll('#view-'+views[i]+' tbody tr, #view-'+views[i]+' .dash-fleet-card').length+' texto='+sig($('#view-'+views[i]).textContent.replace(/\s+/g,' ')));
    }
    var modals=cliMode?[['vehiculos','openVehiculoModal','modal-vehiculo','closeVehiculoModal']]:[
      ['clientes','openClienteModal','modal-cliente','closeClienteModal'],
      ['balance','openGastoModal','modal-gasto','closeGastoModal'],
      ['vehiculos','openVehiculoModal','modal-vehiculo','closeVehiculoModal'],
      ['dispositivos','openDispositivoModal','modal-dispositivo','closeDispositivoModal']
    ];
    for(var j=0;j<modals.length;j++){
      var m=modals[j];
      nav(m[0]); await sleep(400);
      if(click(act(m[1]),m[1])){ await sleep(400);
        if(!$('#'+m[2]).classList.contains('show')) fail('modal no abierto: '+m[2]);
        if(m[2]==='modal-vehiculo'){
          // El vehículo se identifica por su número de coche (vehiculos.nombre): un solo campo, sin "Nombre del vehículo".
          var ln=$('#modal-vehiculo label[for="vf-nombre"]');
          if(!ln||ln.textContent.trim()!=='Número de coche') fail('vehiculo: la etiqueta del campo debe ser "Número de coche": '+(ln&&ln.textContent));
          if($('#vf-numero')) fail('vehiculo: sobra el campo separado de número');
          if($('#vf-nombre').placeholder!=='106') fail('vehiculo: placeholder del número de coche: '+$('#vf-nombre').placeholder);
          if(/Nombre del vehículo/.test($('#modal-vehiculo').textContent)) fail('vehiculo: aparece "Nombre del vehículo"');
        }
        click(act(m[3]),m[3]); await sleep(100);
        if($('#'+m[2]).classList.contains('show')) fail('modal no cerrado: '+m[2]);
      }
    }
    nav('stock'); await sleep(500);
    log.push('stock filas='+d.querySelectorAll('#tbody-stock tr').length);
    if(cliMode){
      // Stock de solo lectura para el cliente: sin alta, edición ni baja
      var stockAcc=Array.prototype.some.call(d.querySelectorAll('#view-stock [data-action="openStockModal"]'),function(b){ return b.getClientRects().length>0; });
      if(stockAcc) fail('stock(cliente): ve el alta de compras');
      if(d.querySelectorAll('#tbody-stock button[data-sa]').length) fail('stock(cliente): ve botones de editar/eliminar');
    } else if(click(act('openStockModal'),'openStockModal')){ await sleep(400);
      if(!$('#modal-stock').classList.contains('show')) fail('modal-stock no abierto');
      click(act('closeStockModal'),'closeStockModal'); }
    nav('vehiculos'); await sleep(500);
    var nb=d.querySelector('#tbody-vehiculos [data-va="neum"],#tbody-vehiculos [data-action="openNeumaticosModal"], #tbody-vehiculos [onclick*="openNeumaticosModal"]');
    if(nb){ nb.click(); await sleep(600);
      if(!$('#modal-neumaticos').classList.contains('show')) fail('modal-neumaticos no abierto');
      var tire=d.querySelector('#modal-neumaticos svg g[cursor="pointer"], #modal-neumaticos svg g[style*="cursor"]');
      if(tire){ tire.dispatchEvent(new w.MouseEvent('click',{bubbles:true})); await sleep(300); log.push('neum-panel-len='+$('#neum-detail-panel').innerHTML.length); }
      else log.push('sin rueda clicable; svg-nodos='+d.querySelectorAll('#neum-assign-svg *').length);
      click(act('closeNeumaticosModal'),'closeNeumaticosModal'); await sleep(100);
    } else log.push('sin boton neumaticos en fila');
    nav('mediciones'); await sleep(500);
    var dm=d.querySelector('[data-mode="device"],[data-mode="dispositivo"]');
    if(dm){ dm.click(); await sleep(600); } else log.push('sin tab modo dispositivo');
    var di=d.querySelector('#med-device-list .device-item');
    if(di){ di.click(); await sleep(700);
      var si=d.querySelector('#med-sessions-list .session-item');
      if(si){ si.click(); await sleep(700); log.push('sesion seleccionada'); } else fail('sin sesiones');
    } else log.push('sin device-item');
    // --- clientes (alta con/sin contraseña, baja lógica): tests/smoke/clientes.flow.js ---
    if(!cliMode) await window.clientesFlow(w,d,sleep,fail,log);
    if(!cliMode) await window.cicloFlow(w,d,sleep,fail,log);
    await window.cambioFlow(w,d,sleep,fail,log); // admin y cliente: tests/smoke/cambio.flow.js
    // --- fin clientes ---
    // --- salud de dispositivos y ficha de cliente: tests/smoke/salud.flow.js ---
    await window.saludFlow(w,d,sleep,fail,log,cliMode);
    // --- sucursales (ABM admin, selector del perfil global, perfil de sucursal): tests/smoke/seccionales.flow.js ---
    if(!cliMode) await window.seccionalesAdminFlow(w,d,sleep,fail,log);
    else if(/[?&]secuser=1/.test(location.search)) await window.seccionalesUsuarioFlow(w,d,sleep,fail,log);
    else await window.seccionalesClienteFlow(w,d,sleep,fail,log);
    if(cliMode && !/[?&]secuser=1/.test(location.search)) await window.sucursalesClienteFlow(w,d,sleep,fail,log);
    var endV=(location.search.match(/[?&]end=([a-z]+)/)||[])[1];
    if(endV){ nav(endV); await sleep(600); }
    log.push('svg-nodos='+d.querySelectorAll('#view-mediciones svg *').length);
    log.push('handlers-inline='+d.querySelectorAll('[onclick],[onchange],[oninput],[onsubmit]').length);
    log.push('xss(<Beta> crudo)='+(d.body.innerHTML.indexOf('<Beta>')===-1?'no':'SI'));
  }catch(e){ if(!(e&&e.message==='__done')) fail('harness: '+(e&&e.stack||e)); }
  var out=document.createElement('pre'); out.id='smoke-log'; out.textContent='\n'+log.join('\n')+'\n'+errors.join('\n'); document.body.appendChild(out);
  document.title = errors.length ? 'SMOKE:FAIL:'+errors.slice(0,5).join(' | ').slice(0,400) : 'SMOKE:OK';
})();
</script></body></html>
