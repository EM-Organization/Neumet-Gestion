name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Binario OSS fijado: gitleaks-action@v2 exige licencia en repos de organización.
      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan full history for secrets
        run: ./gitleaks git --no-banner --redact -v .

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar vercel.json
        run: python3 -m json.tool vercel.json > /dev/null
      - name: Sintaxis de los módulos del panel
        run: node tests/check-modules.mjs
      - name: Chequeo de Edge Function (si hay deno)
        run: |
          if command -v deno >/dev/null 2>&1; then
            deno check supabase/functions/contacto/index.ts
          else
            echo "deno no disponible; se omite"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # node:test integrado: sin dependencias, no necesita npm ci
      - run: npm test

  deno:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check (Edge Functions)
        run: deno task --config supabase/functions/deno.json check
      - name: deno lint (Edge Functions)
        run: deno lint --config supabase/functions/deno.json supabase/functions
      - name: deno test (Edge Functions; incluye Postgres local si hay binarios)
        run: deno task --config supabase/functions/deno.json test

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Cliente psql
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Migraciones + tests SQL (Postgres desechable)
        env:
          TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: tests/sql/run.sh

  e2e:
    # Panel real en Chrome headless contra Postgres 16 (todas las migraciones + seed demo) y PostgREST real.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cliente psql
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: E2E (PostgREST v16.5 con SHA-256 fijado; Chrome del runner)
        env:
          E2E_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
          E2E_CAPTURAS: ${{ github.workspace }}/e2e-capturas
        run: npm run e2e
      - name: Capturas de los fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-capturas
          path: e2e-capturas/
          if-no-files-found: ignore
